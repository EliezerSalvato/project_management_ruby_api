AuthenticationRequest:
  type: object
  required: [email, password]
  properties:
    email:
      type: string
      format: email
    password:
      type: string
      format: password
      minLength: 8
    remember_me:
      type: boolean
      description: When true, the refresh cookie gets a 30-day Expires and the server-side refresh lasts 30 days. When false/omitted, the cookie is a browser session cookie and the server-side refresh lasts 1 day.

RegistrationRequest:
  type: object
  required: [first_name, last_name, email, password, password_confirmation]
  properties:
    first_name:
      type: string
    last_name:
      type: string
    email:
      type: string
      format: email
    password:
      type: string
      format: password
      minLength: 8
    password_confirmation:
      type: string
      format: password

RefreshSessionRequest:
  type: object
  properties:
    remember_me:
      type: boolean
      description: Optional. Controls the lifetime of the rotated refresh cookie (same rules as sign-in).

ProfileUpdateRequest:
  type: object
  required: [first_name, last_name]
  properties:
    first_name:
      type: string
    last_name:
      type: string

AccountDeletionRequest:
  type: object
  required: [password]
  properties:
    password:
      type: string
      format: password

EmailConfirmationRequest:
  type: object
  required: [token]
  properties:
    token:
      type: string

EmailChangeRequest:
  type: object
  required: [current_password, new_email]
  properties:
    current_password:
      type: string
      format: password
    new_email:
      type: string
      format: email

PasswordChangeRequest:
  type: object
  required: [current_password, password, password_confirmation]
  properties:
    current_password:
      type: string
      format: password
    password:
      type: string
      format: password
      minLength: 8
    password_confirmation:
      type: string
      format: password

PasswordResetRequest:
  type: object
  required: [email]
  properties:
    email:
      type: string
      format: email

PasswordResetUpdateRequest:
  type: object
  required: [token, password, password_confirmation]
  properties:
    token:
      type: string
    password:
      type: string
      format: password
      minLength: 8
    password_confirmation:
      type: string
      format: password

TokensData:
  type: object
  required: [token, user]
  properties:
    token:
      type: string
      description: Session token (Bearer). Expires in 15 minutes.
    user:
      $ref: "#/UserResource"

TokensSuccessResponse:
  type: object
  required: [status, type, data]
  properties:
    status:
      type: string
      const: success
    type:
      type: string
      const: object
    data:
      $ref: "#/TokensData"

MessageSuccessResponse:
  type: object
  required: [status]
  properties:
    status:
      type: string
      const: success
    message:
      type: string

UserAttributes:
  type: object
  properties:
    id:
      type: string
      format: uuid
    first_name:
      type: string
    last_name:
      type: string
    email:
      type: string
      format: email

UserResource:
  type: object
  properties:
    data:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          const: user
        attributes:
          $ref: "#/UserAttributes"

RegistrationSuccessResponse:
  type: object
  required: [status, type, data]
  properties:
    status:
      type: string
      const: success
    type:
      type: string
      const: object
    data:
      type: object
      properties:
        user:
          $ref: "#/UserResource"

ErrorResponse:
  type: object
  required: [status, message, details]
  properties:
    status:
      type: string
      const: error
    message:
      type: string
    details:
      type: object
      additionalProperties:
        type: array
        items:
          type: string
