post:
  tags: [Authentication]
  summary: Sign in
  description: |
    Authenticates with email and password.
    The user must be **verified** and **active**.
    Returns a short-lived session `token` in the body. The `refresh_token` is not in the body: it is set as an
    encrypted httpOnly cookie named `refresh_token`.
    With `remember_me: true` the refresh token lasts 30 days and the cookie is persistent. Without it, the refresh
    token lasts 1 day and the cookie is a browser-session cookie.
  operationId: createAuthentication
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../components/schemas.yml#/AuthenticationRequest"
        example:
          email: john.doe@example.com
          password: password123
          remember_me: true
  responses:
    "200":
      description: Authenticated
      headers:
        Set-Cookie:
          description: Encrypted httpOnly `refresh_token` cookie.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "../../components/schemas.yml#/TokensSuccessResponse"
          example:
            status: success
            type: object
            data:
              token: eyJfcmFpbHMiOnsibWVzc2FnZSI6IkJBaEpJaWs9IiwiZXhwIjpudWxsLCJwdXIiOiJzZXNzaW9uX3Rva2VuIn19--abc
              user:
                data:
                  id: 01a1bb68-0a49-77d0-b4c7-c9664d142fa2
                  type: ""
                  attributes:
                    id: 01a1bb68-0a49-77d0-b4c7-c9664d142fa2
                    first_name: John
                    last_name: Doe
                    email: john.doe@example.com
    "422":
      $ref: "../../components/responses.yml#/UnprocessableContent"
