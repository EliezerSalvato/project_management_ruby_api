post:
  tags: [Authentication]
  summary: Sign in
  description: |
    Authenticates with email and password.
    The user must be **verified** and **active**.
    Returns a short-lived session `token` in the JSON body.
    Sets a long-lived encrypted httpOnly `refresh_token` cookie.
  operationId: createAuthentication
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../components/schemas.yml#/AuthenticationRequest"
        example:
          email: john.doe@example.com
          password: password123
          remember_me: true
  responses:
    "200":
      description: Authenticated
      headers:
        Set-Cookie:
          description: Encrypted httpOnly `refresh_token` cookie (`SameSite=Lax`). With `remember_me`, also sets `Expires` (30 days).
          schema:
            type: string
          example: refresh_token=...; path=/; HttpOnly; SameSite=Lax
      content:
        application/json:
          schema:
            $ref: "../../components/schemas.yml#/TokensSuccessResponse"
          example:
            status: success
            type: object
            data:
              token: eyJfcmFpbHMiOnsibWVzc2FnZSI6IkJBaEpJaWs9IiwiZXhwIjpudWxsLCJwdXIiOiJzZXNzaW9uX3Rva2VuIn19--abc
              user:
                data:
                  id: "1"
                  type: user
                  attributes:
                    id: 019abcde-1234-7000-8000-000000000001
                    first_name: John
                    last_name: Doe
                    email: john.doe@example.com
    "422":
      $ref: "../../components/responses.yml#/UnprocessableContent"
