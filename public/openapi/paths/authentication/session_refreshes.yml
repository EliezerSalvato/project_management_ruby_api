patch:
  tags: [Authentication]
  summary: Refresh session
  description: |
    Exchanges the `refresh_token` cookie for a new session `token` and rotates the cookie.
    The refresh token is read only from the encrypted httpOnly `refresh_token` cookie set at sign in, never from
    the body. Browsers must send credentials (`fetch(..., { credentials: "include" })`).
    Does not require the Bearer header.
    Send `remember_me: true` again to keep the 30-day persistent cookie; otherwise the new refresh token lasts 1 day.
  operationId: refreshSession
  requestBody:
    required: false
    content:
      application/json:
        schema:
          $ref: "../../components/schemas.yml#/RefreshSessionRequest"
        example:
          remember_me: true
  responses:
    "200":
      description: Tokens rotated
      headers:
        Set-Cookie:
          description: Rotated encrypted httpOnly `refresh_token` cookie.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "../../components/schemas.yml#/TokensSuccessResponse"
    "422":
      $ref: "../../components/responses.yml#/UnprocessableContent"
