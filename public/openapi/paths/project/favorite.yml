parameters:
  - name: project_id
    in: path
    required: true
    schema:
      type: string
      format: uuid

post:
  tags: [Projects]
  summary: Favorite a project
  description: Sets `favorite` to true. Repeating the call keeps it true.
  operationId: favoriteProject
  security:
    - bearerAuth: []
  responses:
    "200":
      description: Project favorited
      content:
        application/json:
          schema:
            $ref: "../../components/schemas.yml#/ProjectSuccessResponse"
    "401":
      $ref: "../../components/responses.yml#/Unauthorized"
    "404":
      $ref: "../../components/responses.yml#/NotFound"

delete:
  tags: [Projects]
  summary: Unfavorite a project
  description: Sets `favorite` to false. Repeating the call keeps it false.
  operationId: unfavoriteProject
  security:
    - bearerAuth: []
  responses:
    "200":
      description: Project unfavorited
      content:
        application/json:
          schema:
            $ref: "../../components/schemas.yml#/ProjectSuccessResponse"
    "401":
      $ref: "../../components/responses.yml#/Unauthorized"
    "404":
      $ref: "../../components/responses.yml#/NotFound"
