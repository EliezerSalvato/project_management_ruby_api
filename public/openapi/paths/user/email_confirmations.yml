post:
  tags: [User]
  summary: Confirm email
  description: |
    Confirms the user email with the token received by email.
    For an email change, applies the new address. Revokes active sessions. Public endpoint.
  operationId: confirmEmail
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../components/schemas.yml#/EmailConfirmationRequest"
        example:
          token: confirmation-token-from-email
  responses:
    "200":
      description: Email confirmed
      content:
        application/json:
          schema:
            $ref: "../../components/schemas.yml#/MessageSuccessResponse"
    "422":
      $ref: "../../components/responses.yml#/UnprocessableContent"
