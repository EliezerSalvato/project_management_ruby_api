title: Project Management Ruby API
version: "1.0.2"
description: |
  ## Autenticação

  Endpoints protegidos exigem um **token de sessão Bearer** no header `Authorization`:

  ```http
  Authorization: Bearer <token>
  ```

  ### Fluxo

  1. **Cadastro** — `POST /api/v1/user/registrations`
  2. **Confirmar e-mail** — `POST /api/v1/user/email/confirmations` (token recebido por e-mail)
  3. **Login** — `POST /api/v1/user/authentications` → recebe o `token` no corpo; o `refresh_token` é gravado em um cookie httpOnly criptografado
  4. **Chamar endpoints protegidos** com `Authorization: Bearer <token>`
  5. **Renovar** — quando o token de sessão expirar, `PATCH /api/v1/user/session/refreshes` (lê o cookie `refresh_token`)
  6. **Revogar** — `DELETE /api/v1/user/session/revokes` para invalidar todas as sessões ativas

  ### Validade dos tokens

  | Token | Validade |
  |-------|----------|
  | Sessão (`token`) | 15 minutos |
  | Refresh (`refresh_token`, `remember_me: true`) | 30 dias (cookie persistente) |
  | Refresh (`refresh_token`, sem `remember_me`) | 1 dia (cookie de sessão do navegador) |
  | Confirmação de e-mail | 24 horas |
  | Redefinição de senha | 15 minutos |

  ### Públicos vs protegidos

  | Acesso | Endpoints |
  |--------|-----------|
  | Público | registrations, authentications, email confirmations, password resets, session refreshes |
  | Bearer obrigatório | accounts, profiles, email changes, password changes, session revokes |

  ---

  ## Idioma

  As respostas são em português do Brasil (`pt-BR`) por padrão. Idiomas suportados: `pt-BR`, `en`.

  Envie o header `Accept-Language` para escolher um deles (`Accept-Language: en`). A API também lê o cookie
  `locale`, mas o navegador só o envia quando o cliente e a API estão no mesmo site, então clientes em outro
  site devem usar o header. Quando os dois estão presentes, o cookie tem prioridade.

  ---

  ## Envelope de resposta

  Sucesso:

  ```json
  { "status": "success", "type": "object", "data": {}, "message": "opcional" }
  ```

  Erro:

  ```json
  { "status": "error", "message": "...", "details": { "campo": ["..."] } }
  ```
