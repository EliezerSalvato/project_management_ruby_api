post:
  tags: [Autenticação]
  summary: Login
  description: |
    Autentica com e-mail e senha.
    O usuário deve estar **verificado** e **ativo**.
    Retorna um `token` de sessão de curta duração e um `refresh_token` de longa duração.
  operationId: createAuthentication
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../components/schemas.yml#/AuthenticationRequest"
        example:
          email: john.doe@example.com
          password: password123
  responses:
    "200":
      description: Autenticado
      content:
        application/json:
          schema:
            $ref: "../../components/schemas.yml#/TokensSuccessResponse"
          example:
            status: success
            type: object
            data:
              token: eyJfcmFpbHMiOnsibWVzc2FnZSI6IkJBaEpJaWs9IiwiZXhwIjpudWxsLCJwdXIiOiJzZXNzaW9uX3Rva2VuIn19--abc
              refresh_token: a1b2c3d4e5f6...
    "422":
      $ref: "../../components/responses.yml#/UnprocessableContent"
