post:
  tags: [Autenticação]
  summary: Login
  description: |
    Autentica com e-mail e senha.
    O usuário deve estar **verificado** e **ativo**.
    Retorna um `token` de sessão de curta duração no corpo. O `refresh_token` não vem no corpo: ele é gravado em
    um cookie httpOnly criptografado chamado `refresh_token`.
    Com `remember_me: true` o refresh token dura 30 dias e o cookie é persistente. Sem ele, o refresh token dura
    1 dia e o cookie é de sessão do navegador.
  operationId: createAuthentication
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../components/schemas.yml#/AuthenticationRequest"
        example:
          email: john.doe@example.com
          password: password123
          remember_me: true
  responses:
    "200":
      description: Autenticado
      headers:
        Set-Cookie:
          description: Cookie httpOnly criptografado `refresh_token`.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "../../components/schemas.yml#/TokensSuccessResponse"
          example:
            status: success
            type: object
            data:
              token: eyJfcmFpbHMiOnsibWVzc2FnZSI6IkJBaEpJaWs9IiwiZXhwIjpudWxsLCJwdXIiOiJzZXNzaW9uX3Rva2VuIn19--abc
              user:
                data:
                  id: 01a1bb68-0a49-77d0-b4c7-c9664d142fa2
                  type: ""
                  attributes:
                    id: 01a1bb68-0a49-77d0-b4c7-c9664d142fa2
                    first_name: John
                    last_name: Doe
                    email: john.doe@example.com
    "422":
      $ref: "../../components/responses.yml#/UnprocessableContent"
