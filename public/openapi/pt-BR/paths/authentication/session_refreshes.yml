patch:
  tags: [Autenticação]
  summary: Renovar sessão
  description: |
    Troca o cookie `refresh_token` por um novo `token` de sessão e rotaciona o cookie.
    O refresh token é lido apenas do cookie httpOnly criptografado `refresh_token` gravado no login, nunca do
    corpo. Navegadores precisam enviar credenciais (`fetch(..., { credentials: "include" })`).
    Não exige o header Bearer.
    Envie `remember_me: true` de novo para manter o cookie persistente de 30 dias; sem ele, o novo refresh token
    dura 1 dia.
  operationId: refreshSession
  requestBody:
    required: false
    content:
      application/json:
        schema:
          $ref: "../../components/schemas.yml#/RefreshSessionRequest"
        example:
          remember_me: true
  responses:
    "200":
      description: Tokens rotacionados
      headers:
        Set-Cookie:
          description: Cookie httpOnly criptografado `refresh_token` rotacionado.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "../../components/schemas.yml#/TokensSuccessResponse"
    "422":
      $ref: "../../components/responses.yml#/UnprocessableContent"
