patch:
  tags: [Autenticação]
  summary: Renovar sessão
  description: |
    Troca um `refresh_token` válido por um novo `token` de sessão e um `refresh_token` rotacionado.
    Não exige o header Bearer.
  operationId: refreshSession
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../components/schemas.yml#/RefreshSessionRequest"
        example:
          refresh_token: a1b2c3d4e5f6...
  responses:
    "200":
      description: Tokens rotacionados
      content:
        application/json:
          schema:
            $ref: "../../components/schemas.yml#/TokensSuccessResponse"
    "422":
      $ref: "../../components/responses.yml#/UnprocessableContent"
