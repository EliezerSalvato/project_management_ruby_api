delete:
  tags: [Usuário]
  summary: Excluir conta
  description: Exclui permanentemente o usuário autenticado. Exige a senha atual.
  operationId: deleteAccount
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../components/schemas.yml#/AccountDeletionRequest"
        example:
          password: password123
  responses:
    "200":
      description: Conta excluída
      content:
        application/json:
          schema:
            $ref: "../../components/schemas.yml#/MessageSuccessResponse"
    "422":
      $ref: "../../components/responses.yml#/UnprocessableContent"
    "500":
      $ref: "../../components/responses.yml#/Unauthorized"
