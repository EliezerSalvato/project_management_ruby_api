patch:
  tags: [Usuário]
  summary: Alterar senha
  description: Altera a senha do usuário autenticado. Exige a senha atual.
  operationId: changePassword
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../components/schemas.yml#/PasswordChangeRequest"
        example:
          current_password: password123
          password: new-password123
          password_confirmation: new-password123
  responses:
    "200":
      description: Senha alterada
      content:
        application/json:
          schema:
            $ref: "../../components/schemas.yml#/MessageSuccessResponse"
    "422":
      $ref: "../../components/responses.yml#/UnprocessableContent"
    "500":
      $ref: "../../components/responses.yml#/Unauthorized"
