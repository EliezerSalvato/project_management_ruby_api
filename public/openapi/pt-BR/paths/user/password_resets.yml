post:
  tags: [Usuário]
  summary: Solicitar redefinição de senha
  description: |
    Envia instruções de redefinição de senha para o e-mail informado.
    O usuário deve existir e ter o e-mail verificado. Endpoint público.
  operationId: requestPasswordReset
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../components/schemas.yml#/PasswordResetRequest"
        example:
          email: john.doe@example.com
  responses:
    "200":
      description: Instruções de redefinição enviadas
      content:
        application/json:
          schema:
            $ref: "../../components/schemas.yml#/MessageSuccessResponse"
    "422":
      $ref: "../../components/responses.yml#/UnprocessableContent"

patch:
  tags: [Usuário]
  summary: Redefinir senha
  description: Define uma nova senha usando o token do e-mail de redefinição. Endpoint público.
  operationId: resetPassword
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../components/schemas.yml#/PasswordResetUpdateRequest"
        example:
          token: reset-token-from-email
          password: new-password123
          password_confirmation: new-password123
  responses:
    "200":
      description: Senha redefinida
      content:
        application/json:
          schema:
            $ref: "../../components/schemas.yml#/MessageSuccessResponse"
    "422":
      $ref: "../../components/responses.yml#/UnprocessableContent"
